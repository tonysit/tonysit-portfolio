services:
  portfolio:
    container_name: tonysit-portfolio
    build:
      context: .
      dockerfile: Dockerfile
      args:
        SASS_PATH: ${SASS_PATH:-}
        PORT: ${PORT:-}
        REACT_APP_API_BASE: ${REACT_APP_API_BASE:-}
        REACT_APP_GOOGLE_API_KEY: ${REACT_APP_GOOGLE_API_KEY:-}
    expose:
      - "80"
    networks:
      - home-proxy
    restart: unless-stopped

networks:
  home-proxy:
    external: true
